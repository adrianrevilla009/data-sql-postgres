# Hikari settings for an app that connects through PgBouncer (transaction mode).
# Sizing rule: pool = ((core_count * 2) + effective_spindle_count); start small, measure.
# Sum of all app pools must stay below PgBouncer MAX_CLIENT_CONN; PgBouncer DEFAULT_POOL_SIZE bounds Postgres.
spring.datasource.url=jdbc:postgresql://localhost:16432/postgres?prepareThreshold=0
spring.datasource.username=postgres
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=10
spring.datasource.hikari.connection-timeout=2000
spring.datasource.hikari.max-lifetime=1740000
# prepareThreshold=0: server-side prepared statements are unsafe across transaction-mode pooling on older PgBouncer.
